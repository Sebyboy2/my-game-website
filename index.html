<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>GameHub — Starter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <a class="logo" href="index.html">GAME<span>HUB</span></a>
    <div class="search-wrap">
      <input id="search" type="search" placeholder="Search games..." autocomplete="off">
    </div>
    <button id="randomBtn" class="btn">🎲 Random</button>
  </header>

  <main class="container">
    <section class="hero">
      <div>
        <p class="eyebrow">SEBY'S GAME COLLECTION</p>
        <h1>Play something fun wiff me.</h1>
        <p class="sub">A clean, fast game portal starter you can customize with your own games.</p>
      </div>
      <button id="favoritesBtn" class="btn secondary">☆ Favorites</button>
    </section>

    <nav class="tabs">
      <button class="tab active" data-filter="all">All Games</button>
      <button class="tab" data-filter="action">Action</button>
      <button class="tab" data-filter="arcade">Arcade</button>
      <button class="tab" data-filter="puzzle">Puzzle</button>
      <button class="tab" data-filter="favorites">Favorites</button>
    </nav>

    <section id="grid" class="grid"></section>
    <p id="empty" class="empty hidden">No games match your search.</p>
  </main>

  <footer>GameHub Starter · Add only games you have permission to host or embed.</footer>
  <script src="script.js"></script>
</body>
</html>
